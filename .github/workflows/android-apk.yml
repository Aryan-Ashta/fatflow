# Build FatFlow debug APK and run engine tests on every push.
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      # setup-android passes `packages` as one space-separated sdkmanager arg list.
      # API 37 is published as platforms;android-37.0 (there is no platforms;android-37).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      # AGP compileSdk = 37 looks up platforms/android-37; sdkmanager installs android-37.0.
      - name: Alias API 37 platform
        working-directory: ${{ github.workspace }}
        run: |
          platforms="${ANDROID_SDK_ROOT}/platforms"
          if [ -d "$platforms/android-37.0" ] && [ ! -e "$platforms/android-37" ]; then
            ln -s android-37.0 "$platforms/android-37"
          fi
          ls -l "$platforms"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run engine tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fatflow-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          asset="fatflow-${short}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$asset"
          gh release create "apk-${GITHUB_SHA}" "$asset" \
            --target "$GITHUB_SHA" \
            --title "FatFlow debug ${short}" \
            --notes "Debug APK from \`${GITHUB_SHA}\`."